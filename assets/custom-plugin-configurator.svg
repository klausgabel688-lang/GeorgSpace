<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Georg Space Custom Plugin Configurator</title>
<desc id="desc">Animated preview of the watermark price switch and live plugin price calculator.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b19"/><stop offset=".48" stop-color="#15113b"/><stop offset="1" stop-color="#071d29"/></linearGradient>
  <linearGradient id="neon" x1="0" x2="1"><stop stop-color="#60efff"/><stop offset=".55" stop-color="#9a6cff"/><stop offset="1" stop-color="#ff65cf"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="round"><rect width="1200" height="360" rx="34"/></clipPath>
</defs>
<g clip-path="url(#round)">
<rect width="1200" height="360" fill="url(#bg)"/>
<circle cx="1030" cy="40" r="210" fill="#703cff" opacity=".12"><animate attributeName="r" values="180;230;180" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="110" cy="330" r="190" fill="#00dff0" opacity=".09"><animate attributeName="cx" values="80;145;80" dur="7s" repeatCount="indefinite"/></circle>
<g fill="#fff" opacity=".35"><circle cx="80" cy="65" r="2"/><circle cx="235" cy="42" r="1.5"/><circle cx="715" cy="74" r="2"/><circle cx="1100" cy="285" r="1.5"/></g>
<rect x="3" y="3" width="1194" height="354" rx="31" fill="none" stroke="url(#neon)" stroke-width="3" opacity=".65"/>
<text x="70" y="74" fill="#6deeff" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">CUSTOM PLUGIN · LIVE PRICE</text>
<text x="70" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="44" font-weight="800">Build your own plugin</text>
<text x="70" y="174" fill="#aab2d3" font-family="Arial,sans-serif" font-size="21">Choose version, size, premium tier and watermark.</text>
<g transform="translate(70 215)">
  <rect width="410" height="78" rx="18" fill="#ffffff0c" stroke="#ffffff25"/>
  <text x="24" y="31" fill="#cdd3e9" font-family="Arial,sans-serif" font-size="17">Watermark ON</text>
  <text x="24" y="58" fill="#67f4c2" font-family="Arial,sans-serif" font-size="22" font-weight="800">+0 €</text>
  <rect x="298" y="19" width="88" height="42" rx="21" fill="#2cdba2"/>
  <circle cx="365" cy="40" r="16" fill="#fff"><animate attributeName="cx" values="365;319;365" dur="4s" repeatCount="indefinite"/></circle>
  <animate attributeName="opacity" values="1;1;.55;.55;1" dur="4s" repeatCount="indefinite"/>
</g>
<g transform="translate(515 215)">
  <rect width="260" height="78" rx="18" fill="#ff5d9a10" stroke="#ff6aa949"/>
  <text x="22" y="31" fill="#cdd3e9" font-family="Arial,sans-serif" font-size="17">Watermark OFF</text>
  <text x="22" y="59" fill="#ff7eb6" font-family="Arial,sans-serif" font-size="22" font-weight="800">+50 €</text>
  <animate attributeName="opacity" values=".55;.55;1;1;.55" dur="4s" repeatCount="indefinite"/>
</g>
<g transform="translate(835 112)" filter="url(#glow)">
  <rect width="295" height="116" rx="24" fill="url(#neon)"/>
  <text x="147" y="48" text-anchor="middle" fill="#100b24" font-family="Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="1">OPEN CONFIGURATOR</text>
  <text x="147" y="83" text-anchor="middle" fill="#100b24" font-family="Arial,sans-serif" font-size="25" font-weight="900">START NOW →</text>
  <animateTransform attributeName="transform" type="translate" values="835 112;835 104;835 112" dur="2.2s" repeatCount="indefinite"/>
</g>
<text x="835" y="270" fill="#929bbd" font-family="Arial,sans-serif" font-size="16">Configure it live on the website</text>
</g>
</svg>