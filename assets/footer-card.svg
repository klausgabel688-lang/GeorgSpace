<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">Build your next server with Georg Space</title>
  <desc id="desc">Animated neon footer card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#021c2d"/><stop offset="0.5" stop-color="#101546"/><stop offset="1" stop-color="#3b0755"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00efff"/><stop offset="0.5" stop-color="#6480ff"/><stop offset="1" stop-color="#ea2cff"/><animate attributeName="x1" values="0;0.5;0" dur="4s" repeatCount="indefinite"/></linearGradient>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="c"><rect x="3" y="3" width="1194" height="184" rx="30"/></clipPath>
  </defs>
  <rect x="3" y="3" width="1194" height="184" rx="30" fill="url(#bg)" stroke="url(#g)" stroke-width="5"/>
  <g clip-path="url(#c)">
    <circle cx="80" cy="95" r="120" fill="#00efff" opacity="0.09"><animate attributeName="r" values="100;145;100" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="95" r="120" fill="#ea2cff" opacity="0.09"><animate attributeName="r" values="145;100;145" dur="4s" repeatCount="indefinite"/></circle>
    <rect x="-160" y="0" width="100" height="190" fill="#fff" opacity="0.08" transform="skewX(-22)"><animate attributeName="x" values="-160;1400" dur="5s" repeatCount="indefinite"/></rect>
  </g>
  <text x="600" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="900" fill="url(#g)" filter="url(#glow)">BUILD YOUR NEXT SERVER WITH GEORG SPACE</text>
  <text x="600" y="116" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="4" fill="#d7faff">CUSTOM PLUGINS • PRIVATE BUILDS • REAL SUPPORT</text>
  <text x="600" y="151" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#aebfe0">Discord tickets are the official purchase channel</text>
</svg>
