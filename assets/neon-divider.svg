<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="38" viewBox="0 0 1200 38" role="img" aria-label="Animated neon divider">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#00f5ff"/>
      <stop offset="0.5" stop-color="#6972ff"/>
      <stop offset="0.8" stop-color="#e127ff"/>
      <stop offset="1" stop-color="#e127ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-400%" width="140%" height="900%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="70" y="17" width="1060" height="4" rx="2" fill="url(#g)" filter="url(#glow)"/>
  <circle cx="70" cy="19" r="7" fill="#fff" filter="url(#glow)"><animate attributeName="cx" values="70;1130;70" dur="4.5s" repeatCount="indefinite"/></circle>
</svg>
